<section id="blog" class="section-container bg-[var(--surface)] border-t border-gray-300">
  <div class="container mx-auto px-4 sm:px-6">
    <div class="text-center mb-14">
      <h2 class="text-3xl md:text-4xl font-bold">
        {{ blogCon.header.title }}
      </h2>
      <p class="text-[var(--primary)] font-medium mt-2 text-lg">
        {{ blogCon.header.subtitle }}
      </p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for(blog of blogCon.blogs; track $index) {
      <div
        class="group bg-[var(--background)] rounded-3xl overflow-hidden border border-[var(--border-color)] shadow-[var(--shadow-lg)] hover:-translate-y-2 transition-all duration-500">
        <div class="relative overflow-hidden">
          <img [src]="blog.imageUrl" [alt]="blog.title" loading="lazy" decoding="async" fetchpriority="high"
            class="w-full h-60 object-cover transition-transform duration-700 group-hover:scale-110">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
          <div
            class="absolute bottom-4 left-4 bg-[var(--primary)] text-white text-sm font-semibold px-4 py-2 rounded-full">
            {{ blog.date }}
          </div>
        </div>
        <div class="p-7">
          <h3
            class="text-2xl font-bold text-[var(--text-heading)] mb-4 group-hover:text-[var(--primary)] transition-colors duration-300">
            {{ blog.title }}
          </h3>
          <p class="text-[var(--text-body)] leading-relaxed mb-6">
            {{ blog.description }}
          </p>
          <button
            class="inline-flex items-center gap-2 text-[var(--primary)] font-semibold hover:gap-3 transition-all duration-300">
            Read More
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
      }
    </div>
  </div>
</section>
