<header [class]="'fixed top-0 left-0 right-0 z-50 transition-all duration-300 ' + (isScrolled() || isMenuOpen() ? 'shadow-[var(--shadow-md)] backdrop-blur-lg bg-[var(--surface-translucent)] border-b border-[var(--glass-border)]' : 'bg-transparent')"
        (window:scroll)="onScroll()">
  <nav class="container mx-auto px-4 sm:px-6 py-4">
    <div class="flex items-center justify-between">
      <a href="#home" (click)="$event.preventDefault(); scrollToSection('home')" class="flex items-center gap-2" aria-label="St. Xavier’s Public School">
        <img class="h-8 w-8 text-[var(--primary)]" src="assets/logo.png" viewBox="0 0 24 24" alt="logo">
        <span class="text-xl font-bold text-[var(--text-heading)] hidden sm:inline">{{name}}</span>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-6">
        @for (item of mainMenuItems; track item.id) {
          <a href="#{{item.id}}" (click)="$event.preventDefault(); scrollToSection(item.id)"
             class="text-[var(--text-body)] hover:text-[var(--primary)] font-medium transition-colors duration-300">{{ item.label }}</a>
        }
        
        <!-- More Dropdown -->
        <div class="relative">
          <button (click)="toggleMoreMenu()" class="text-[var(--text-body)] hover:text-[var(--primary)] focus:outline-none p-2 rounded-full hover:bg-[var(--primary-light)]">
            <span class="sr-only">More options</span>
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01"></path></svg>
          </button>
          
          @if (isMoreMenuOpen()) {
            <div style="animation: fadeInDown 0.2s ease-out forwards;" class="absolute right-0 top-full mt-2 w-56 bg-[var(--surface)] rounded-lg shadow-[var(--shadow-xl)] border border-[var(--border-color)] py-2 z-10 origin-top-right">
              @for (item of moreMenuItems; track item.id) {
                <a href="#{{item.id}}" (click)="$event.preventDefault(); scrollToSection(item.id)" class="block w-full text-left px-4 py-2 text-[var(--text-body)] hover:text-[var(--primary)] hover:bg-[var(--primary-light)] transition-colors duration-200">{{ item.label }}</a>
              }
              <button (click)="downloadFeestructure()" class="block w-full text-left px-4 py-2 text-[var(--text-body)] hover:text-[var(--primary)] hover:bg-[var(--primary-light)] transition-colors duration-200 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Fees Structure</span>
              </button>
              <div class="border-t border-[var(--border-color)] mx-2 my-2"></div>
              <div class="px-4 py-1 flex items-center justify-between">
                <span class="text-sm text-[var(--text-muted)] font-medium">Theme</span>
                <app-theme-toggle></app-theme-toggle>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" class="text-[var(--text-body)] focus:outline-none p-2 rounded-full hover:bg-[var(--primary-light)]">
          <span class="sr-only">Toggle menu</span>
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            @if (!isMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            } @else {
               <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    @if (isMenuOpen()) {
      <div class="md:hidden mt-4 bg-[var(--surface)] rounded-lg shadow-[var(--shadow-xl)] border border-[var(--border-color)]">
        <div class="flex flex-col items-center py-4 space-y-4">
          @for (item of menuItems; track item.id) {
            <a href="#{{item.id}}" (click)="$event.preventDefault(); scrollToSection(item.id)"
               class="text-[var(--text-body)] hover:text-[var(--primary)] font-medium transition-colors px-4 py-2 rounded-md">{{ item.label }}</a>
          }
           <button (click)="downloadFeestructure()" class="bg-[var(--accent)] text-white px-6 py-2 rounded-full font-semibold hover:bg-[var(--accent-hover)] transition-transform duration-300 ease-in-out hover:scale-105 flex items-center gap-2">
             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Fees Structure
           </button>
           <div class="w-full px-4 pt-4">
             <div class="border-t border-[var(--border-color)]"></div>
           </div>
           <app-theme-toggle></app-theme-toggle>
        </div>
      </div>
    }
  </nav>
</header>
