<section id="academics" class="section-container bg-[var(--background)] border-t border-gray-300">
  <div class="container mx-auto px-4 sm:px-6">

    <div class="text-center mb-14">
      <h2 class="text-3xl md:text-4xl font-bold">
        {{ academicsCon.header.title }}
      </h2>

      <p class="text-[var(--primary)] font-medium mt-2 text-lg">
        {{ academicsCon.header.subtitle }}
      </p>

      <p class="text-[var(--text-body)] mt-6 max-w-3xl mx-auto leading-relaxed">
        {{ academicsCon.intro }}
      </p>
    </div>

    <div class="grid md:grid-cols-3 gap-8 mb-14">

      <div
        *ngFor="let item of academicsCon.sections"
        class="bg-[var(--surface)] border border-[var(--border-color)] rounded-2xl p-8 shadow-[var(--shadow-md)] hover:shadow-[var(--shadow-lg)] transition-all duration-300"
      >
        <h3 class="text-2xl font-bold mb-2 text-[var(--text-heading)]">
          {{ item.title }}
        </h3>

        <p class="text-[var(--primary)] font-semibold mb-4">
          {{ item.classes }}
        </p>

        <p class="text-[var(--text-body)] leading-relaxed">
          {{ item.description }}
        </p>
      </div>

    </div>

    <div class="bg-[var(--surface)] border border-[var(--border-color)] rounded-2xl p-8 shadow-[var(--shadow-md)]">
      <h3 class="text-2xl font-bold mb-6 text-center">
        Academic Highlights
      </h3>

      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">

        <div
          *ngFor="let item of academicsCon.highlights"
          class="bg-[var(--primary-light)] rounded-xl px-5 py-4 text-[var(--text-heading)] font-medium"
        >
          {{ item }}
        </div>

      </div>
    </div>

  </div>
</section>
