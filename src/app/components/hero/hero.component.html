<section id="home" class="bg-[var(--background)] min-h-screen flex items-center justify-center section-container relative overflow-hidden border-t border-gray-300">
  
  <!-- Gradient Background Decoration -->
  <div class="absolute top-0 left-0 w-full h-full opacity-30">
      <div class="absolute -top-1/4 -left-1/4 w-3/4 h-3/4 bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] rounded-full filter blur-3xl"></div>
      <div class="absolute -bottom-1/4 -right-1/4 w-3/4 h-3/4 bg-gradient-to-tl from-[var(--primary)] to-[var(--accent)] rounded-full filter blur-3xl"></div>
  </div>

  <div class="container mx-auto px-4 sm:px-6 relative z-10">
    <div class="grid lg:grid-cols-2 items-center gap-16">
      <!-- Left Content -->
      <div class="text-center lg:text-left">
        <p class="text-[var(--primary)] text-lg md:text-xl font-semibold tracking-wider mb-2">Welcome to {{ schoolName }}</p>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold text-[var(--text-heading)] my-4 leading-tight">
          Inspiring Young Minds Through Quality Education
        </h1>
        <p class="text-base sm:text-lg text-[var(--text-body)] mb-8 max-w-xl mx-auto lg:mx-0">
          {{ schoolName }} is committed to academic excellence, discipline, moral values, and holistic development to build a brighter future for every student.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
          <button (click)="scrollTo('contact')" class="w-full sm:w-auto bg-[var(--primary)] text-white px-8 py-3 rounded-full font-semibold text-lg hover:bg-[var(--primary-hover)] transition-all duration-300 ease-in-out hover:scale-105 shadow-[var(--shadow-lg)] hover:shadow-[0_10px_20px_var(--primary-glow)]">
            Get In Touch
          </button>
          <button (click)="scrollTo('about')" class="w-full sm:w-auto bg-[var(--surface)] text-[var(--text-heading)] border border-[var(--border-color)] px-8 py-3 rounded-full font-semibold text-lg hover:bg-[var(--primary-light)] hover:border-[var(--primary)] hover:text-[var(--primary)] transition-all duration-300 ease-in-out hover:scale-105 shadow-[var(--shadow-md)]">
            Explore More
          </button>
        </div>
      </div>
      <!-- Right Image -->
      <div class="flex justify-center">
        <div class="relative w-200 h-120 sm:w-200 sm:h-120 group">
          <div class="absolute inset-0 bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] rounded-full -z-10 transition-transform duration-500 group-hover:scale-110 blur-lg opacity-60 group-hover:opacity-80"></div>
          <div class="absolute inset-0 bg-gradient-to-tl from-[var(--primary)] to-[var(--accent)] rounded-full -z-10 transition-transform duration-500 group-hover:scale-105 animate-pulse"></div>
          <img src="assets/4.webp" title="Campus building of {{ schoolName }}" alt="Campus building of {{ schoolName }}" loading="lazy" decoding="async" fetchpriority="high" class="relative object-cover w-full h-full rounded-full border-8 border-[var(--surface)] shadow-[var(--shadow-xl)] transition-transform duration-500 group-hover:scale-105">
        </div>
      </div>
    </div>
  </div>
</section>
